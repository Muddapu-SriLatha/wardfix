version: '3.8'

services:
  # 1. Database Tier: PostgreSQL 15 with PostGIS Spatial Extension
  db:
    image: postgis/postgis:15-3.3
    container_name: civicfix-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicfix_db}
      POSTGRES_USER: ${POSTGRES_USER:-civicfix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicfix_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicfix_user} -d ${POSTGRES_DB:-civicfix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Tier: Node.js Express REST API & WebSocket Gateway
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civicfix-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-civicfix_db}
      DB_USER: ${POSTGRES_USER:-civicfix_user}
      DB_PASS: ${POSTGRES_PASSWORD:-civicfix_secret}
      JWT_SECRET: ${JWT_SECRET:-civicfix_jwt_secret_key_2026}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads

  # 3. AI Tier: FastAPI Image Classifier Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: civicfix-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    volumes:
      - ./ai-service:/app

volumes:
  pgdata:
